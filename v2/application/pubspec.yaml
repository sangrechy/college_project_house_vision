name: house_vision
description: "House Vision v2 - Next-Gen AR & 3D Construction Visualization Architecture"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Firebase Suite
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.8.0

  # 3D and Augmented Reality
  model_viewer_plus: ^1.10.0
  vector_math: ^2.2.0
  ar_flutter_plugin_plus: ^1.1.3

  # Computer Vision & Camera Telemetry
  image: ^4.3.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/house.glb
    - assets/models/house.png
    - assets/models/house_ar.glb
